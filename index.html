<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arturo Tramontini — Mandelbrot</title>
  
  <meta name="description" content="Mandelbrot Fractal Gallery — Arturo Tramontini">
  <meta name="author" content="Arturo Tramontini">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2226%22 font-size=%2228%22>🌀</text></svg>">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Minimal Header / Brand -->
  <header class="minimal-header">
    <div class="header-content">
      <span class="site-title">Arturo Tramontini</span>
    </div>
    <div class="header-views" title="Visite totali del sito">
      <span class="header-views-label">Visite</span>
      <span class="header-views-val" id="site-views-count">-</span>
    </div>
  </header>

  <!-- Gallery Grid (Solo Immagini) -->
  <main class="gallery-wrapper">
    <div class="gallery-grid" id="gallery-grid">
      <!-- Generato dinamicamente da app.js -->
    </div>
  </main>

  <!-- Modal Dettagli & Download (Due sezioni orizzontali: Quadro a tutto schermo in alto, riquadro info fisso in basso, chiusura solo con tasto ESC) -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <!-- 1. Parte in alto: Quadro a tutto schermo mantenendo le proporzioni native -->
      <div class="modal-image-container">
        <img id="modal-image" src="" alt="Mandelbrot preview">
      </div>

      <!-- 2. Parte in basso: Riquadro a dimensione fissa con informazioni e download -->
      <div class="modal-info-panel">
        <div class="modal-info-content">
          <!-- Colonna Sinistra: Titolo e promemoria tasto ESC -->
          <div class="modal-meta-left">
            <h2 class="modal-title" id="modal-title">-</h2>
            <span class="modal-esc-hint">Premi <kbd>ESC</kbd> per chiudere</span>
          </div>

          <!-- Colonna Centrale: Dati tecnici Frattale -->
          <div class="modal-specs-grid">
            <div class="spec-cell">
              <span class="spec-label">Centro Re</span>
              <span class="spec-val" id="modal-real">-</span>
            </div>
            <div class="spec-cell">
              <span class="spec-label">Centro Im</span>
              <span class="spec-val" id="modal-imag">-</span>
            </div>
            <div class="spec-cell">
              <span class="spec-label">Zoom</span>
              <span class="spec-val" id="modal-zoom">-</span>
            </div>
            <div class="spec-cell">
              <span class="spec-label">Iterazioni</span>
              <span class="spec-val" id="modal-iter">-</span>
            </div>
            <div class="spec-cell">
              <span class="spec-label">Risoluzione</span>
              <span class="spec-val" id="modal-res">-</span>
            </div>
            <div class="spec-cell">
              <span class="spec-label">Visualizzazioni</span>
              <span class="spec-val" id="modal-views">-</span>
            </div>
          </div>

          <!-- Colonna Destra: Bottone Scarica File Originale -->
          <div class="modal-actions-right">
            <a class="btn-download" id="modal-download-btn" href="#" download="" target="_blank">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              Scarica Originale
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Minimal Privacy / Transparency Note (GDPR-compliant cookieless notice) -->
  <footer class="minimal-footer">
    <span>Statistiche anonime senza cookie di tracciamento o profilazione</span>
  </footer>

  <!-- Scripts -->
  <script src="js/gallery-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
